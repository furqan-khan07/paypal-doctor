<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiln &amp; Co.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Kiln &amp; Co.</h1>
    <p>Small-batch ceramics and things for your desk.</p>
  </header>
  <main>
    <section id="products" class="grid"></section>
    <aside id="cart">
      <h2>Cart</h2>
      <ul id="cart-lines"></ul>
      <p class="total">Total <span id="cart-total">$0.00</span></p>
      <div id="paypal-button-container"></div>
      <p id="paypal-note" class="note"></p>
      <p id="result" class="note"></p>
    </aside>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
